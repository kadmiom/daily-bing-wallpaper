name: Build installer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: DailyBingWallpaper-Setup
          path: dist/DailyBingWallpaper-Setup.exe
          if-no-files-found: error
